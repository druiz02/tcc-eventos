version: "3.8"

# Kafka en modo KRaft (sin Zookeeper) — un solo broker, pensado solo
# para desarrollo/pruebas locales del servicio tcc-eventos-guia.
#
# Uso:
#   docker compose up -d
#   docker compose down            # apagar
#   docker compose down -v         # apagar y borrar los datos del tópico

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: tcc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "tcc-local-cluster-0001"

  # Interfaz web opcional para ver tópicos, mensajes y consumidores.
  # Entra en http://localhost:8090 una vez levantado.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tcc-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
